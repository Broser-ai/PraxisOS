name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # F84 · fail fast if package.json loses typecheck/test scripts
      # (avoids a green-looking empty job when scripts are renamed/removed).
      - name: Verify package scripts
        run: |
          node -e "
            const p = require('./package.json');
            const required = ['typecheck', 'test'];
            const missing = required.filter((s) => !p.scripts || typeof p.scripts[s] !== 'string' || !p.scripts[s].trim());
            if (missing.length) {
              console.error('Missing or empty package.json scripts:', missing.join(', '));
              process.exit(1);
            }
            for (const s of required) {
              console.log('ok script', s, '=>', p.scripts[s]);
            }
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
